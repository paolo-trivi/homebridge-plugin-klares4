version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # Types track the oldest supported runtime (engines.node), not the newest Node.
      - dependency-name: '@types/node'
        update-types:
          - version-update:semver-major
    groups:
      # The compiler and the types it compiles against change the published
      # JavaScript and declarations: always reviewed by a person, like runtime
      # dependencies. First in the list: a package belongs to the first group
      # that matches it.
      npm-build-tools:
        patterns:
          - typescript
          - '@types/*'
        update-types:
          - minor
          - patch
      # The other development dependencies never ship in the package and never
      # run in the job that builds it: their minor and patch updates may
      # auto-merge once CI is green. Runtime dependencies are grouped apart so
      # that they are always reviewed by a person.
      npm-dev-minor-and-patch:
        dependency-type: development
        exclude-patterns:
          - typescript
          - '@types/*'
        update-types:
          - minor
          - patch
      npm-runtime-minor-and-patch:
        dependency-type: production
        update-types:
          - minor
          - patch

  # Workflow actions are pinned by commit SHA with the version in a trailing
  # comment (`uses: owner/repo@<sha> # v1.2.3`); Dependabot updates both. These
  # PRs are never auto-merged: an action runs in the publish job too.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch
