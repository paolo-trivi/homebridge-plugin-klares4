name: Dependabot auto-merge

# Only Dependabot's own PRs, and only patch/minor updates of development
# dependencies and GitHub Actions. Runtime dependencies (and anything that is not
# a direct development dependency) always wait for a human review: they end up in
# the published package. This workflow never checks out or runs the PR's code.

on: pull_request_target

permissions: {}

jobs:
  auto-merge:
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      # Every dependency of a grouped PR must qualify, not only the first.
      - name: Decide whether the update may merge without review
        id: decide
        env:
          UPDATES: ${{ steps.meta.outputs.updated-dependencies-json }}
          ECOSYSTEM: ${{ steps.meta.outputs.package-ecosystem }}
        run: |
          set -euo pipefail
          if jq -e --arg ecosystem "$ECOSYSTEM" '
            length > 0 and all(.[];
              (.updateType == "version-update:semver-patch" or .updateType == "version-update:semver-minor")
              and (.dependencyType == "direct:development" or $ecosystem == "github_actions" or $ecosystem == "github-actions"))
          ' <<<"$UPDATES" >/dev/null; then
            echo "allow=true" >> "$GITHUB_OUTPUT"
          else
            echo "allow=false" >> "$GITHUB_OUTPUT"
            echo "Not auto-merging: needs a human review (runtime dependency, major update or indirect)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Enable auto-merge
        if: steps.decide.outputs.allow == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
